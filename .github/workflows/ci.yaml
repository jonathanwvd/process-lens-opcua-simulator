name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: process-plant-simulator validate-catalog
      - name: Test numerical core with coverage
        run: >-
          pytest tests/test_catalog.py tests/test_dataset.py tests/test_engine.py
          --cov --cov-report=term-missing
      - name: Test OPC UA interoperability without coverage instrumentation
        run: pytest tests/test_server.py
      - run: python -m build
